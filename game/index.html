<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>AETHER RIFT</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
<link rel="stylesheet" href="./css/hud.css">
<link rel="stylesheet" href="./css/menu.css">
</head>
<body>
<div id="app"></div>

<div id="hud">
  <!-- floating combat text (under HUD chrome, over the world) -->
  <div id="dmgLayer"></div>

  <!-- top-left: lane minimap (arena is 114x34 — framed to the lane aspect) -->
  <div id="minimapWrap">
    <canvas id="minimap" width="456" height="180"></canvas>
    <div class="mmFrame"></div>
    <div class="mmStud tl"></div><div class="mmStud tr"></div>
    <div class="mmStud bl"></div><div class="mmStud br"></div>
  </div>

  <!-- top-left, under the minimap: champion roster (both sides, live) -->
  <div id="teamPanel">
    <div class="tpRow" id="tpBlue">
      <span class="tpChip"><i class="tpFace"></i><b class="tpLv" id="tpBlueLv">1</b></span>
      <span class="tpMid">
        <span class="tpTop"><b class="tpName">SERA</b><em class="tpKda" id="tpBlueKda">0/0</em></span>
        <span class="tpBar"><i class="tpHp" id="tpBlueHp"></i><i class="tpMp" id="tpBlueMp"></i></span>
      </span>
      <span class="tpUlt" id="tpBlueUlt">R</span>
    </div>
    <div class="tpRow red" id="tpRed">
      <span class="tpChip"><i class="tpFace"></i><b class="tpLv" id="tpRedLv">1</b></span>
      <span class="tpMid">
        <span class="tpTop"><b class="tpName">KARGATH</b><em class="tpKda" id="tpRedKda">0/0</em></span>
        <span class="tpBar"><i class="tpHp" id="tpRedHp"></i><i class="tpMp" id="tpRedMp"></i></span>
      </span>
      <span class="tpUlt" id="tpRedUlt">R</span>
    </div>
  </div>

  <!-- top-center: team score, match timer, structures still standing, next wave -->
  <div id="scoreboard">
    <div class="sbRow">
      <span class="sbTow blue" id="towBlue"><i></i><i></i><b></b></span>
      <span id="scoreBlue" class="scoreNum blue">0</span>
      <span class="sbMark"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M6.9 2 13 8.1l-1.4 1.4L5.5 3.4V2h1.4zm10.2 0h1.4v1.4l-9.8 9.8 1.1 1.1-1.4 1.4-1.4-1.4-2.5 2.5.7.7L3.8 19l-1-1 1.4-1.4.7.7 2.5-2.5-1.4-1.4L7.4 12l1.1 1.1L17.1 2zM16 13.9l2.5 2.5.7-.7 1.4 1.4-1 1-1.4 1.4-1-1 .7-.7-2.5-2.5 1.4-1.4-.8-.8 1.4-1.4 1.4 1.4-1.4 1.4-.4.4z"/></svg></span>
      <span id="scoreRed" class="scoreNum red">0</span>
      <span class="sbTow red" id="towRed"><i></i><i></i><b></b></span>
    </div>
    <div class="sbRule"><i></i><b></b><i></i></div>
    <div class="sbFoot">
      <div id="gameTimer">00:00</div>
      <span class="sbDot"></span>
      <div class="objChip" id="objWave">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#2a1a08" d="M4.4 20.6 3 19.2l7.2-7.2 1.4 1.4zm15.2 0-7.2-7.2 1.4-1.4 7.2 7.2z"/>
          <path fill="#ffd98c" d="M3.6 3.2h3.2l12 12-1.6 1.7-1.7-1.7.1 2.2-2.2-.1 1.7 1.7-1.6 1.6-12-12zm16.8 0h-3.2l-4.6 4.6 2.4 2.4 5.4-5.4z"/>
          <path fill="#fff4d4" opacity=".55" d="M3.6 3.2h3.2l1.6 1.6-3.2 3.2-1.6-1.6z"/>
        </svg>
        <b id="waveTimer">0:00</b>
      </div>
    </div>
  </div>

  <!-- top-right: economy -->
  <div id="statsBar">
    <span class="stat"><i class="ico coin"></i><b id="statGold">0</b></span>
    <span class="vr"></span>
    <span class="stat"><i class="ico csIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12 2.3A7.6 7.6 0 0 0 4.4 9.9v9.4c0 1.3 3.4 2.3 7.6 2.3s7.6-1 7.6-2.3V9.9A7.6 7.6 0 0 0 12 2.3Zm-4.4 8.2h8.8v3.2H7.6Z"/><path fill="#ffd98c" d="M18.6 1.2 21.9 4l-9.1 8.6-1.6-1.4Z" opacity=".95"/></svg></i><b id="statCS">0</b></span>
    <span class="vr"></span>
    <span class="stat kda"><i class="ico kdaIcon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.2 14 7l4.9.5-3.7 3.3 1.1 4.8L12 13.1 7.7 15.6l1.1-4.8L5.1 7.5 10 7zM6.4 17.4h11.2v1.8H6.4zm1.4 3h8.4v1.6H7.8z"/></svg></i><b id="statKDA">0/0/0</b></span>
  </div>

  <div id="killFeed"></div>

  <!-- bottom-left: hero plate -->
  <div id="heroPlate">
    <div class="plateScrim" aria-hidden="true"></div>
    <div id="portrait">
      <div id="portraitImg"></div>
      <div class="portGloss"></div>
      <div class="portInner"></div>
      <div class="portRing"></div>
      <svg class="xpRing" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="xpTrack" cx="50" cy="50" r="45.6"/>
        <circle id="xpFill" class="xpArc" cx="50" cy="50" r="45.6"/>
      </svg>
      <div id="levelBadge">1</div>
    </div>
    <div id="plateBars">
      <div id="heroName">Sera <span>· Blade of Dawn</span></div>
      <div class="barWrap hpWrap">
        <div id="hpGhost"></div>
        <div id="hpFill"></div>
        <div class="barTicks"></div>
        <div class="barGloss"></div>
        <span id="hpText">580/580</span>
      </div>
      <div class="barWrap mpWrap">
        <div id="mpFill"></div>
        <div class="barGloss"></div>
        <span id="mpText">100/100</span>
      </div>
    </div>
  </div>

  <!-- bottom-centre tray: forge entry, relic sockets, settings -->
  <div id="tray">
    <button id="btnShop" class="trayBtn" aria-label="Relic forge">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#120c06" d="M2.3 12.6h19.4v9.3H2.3z"/>
        <path fill="#7a4a1c" d="M3.2 12.9h17.6v8.2H3.2z"/>
        <path fill="#a9691f" d="M3.2 12.9h17.6v3.4H3.2z"/>
        <path fill="#5a3312" d="M3.2 18.2h17.6v2.9H3.2z"/>
        <path fill="#ffd98c" d="M2 11.2h20v2.3H2z"/>
        <path fill="#fff3d0" opacity=".7" d="M2 11.2h20v.9H2z"/>
        <path fill="#120c06" d="M7.1 2.1h9.8l2.4 5.1-2 1.5-1.4-2.4-.5 3.4H8.6l-.5-3.4-1.4 2.4-2-1.5z"/>
        <path fill="#d9a53f" d="M7.8 3h8.4l1.8 4-1 .7L15.4 5l-.6 3.5H9.2L8.6 5 7.2 7.7l-1-.7z"/>
        <path fill="#ffe7b4" d="M9.6 3.7h4.8l-.4 1.6H10z"/>
        <circle cx="12" cy="16.6" r="2.6" fill="#3a86c9"/>
        <circle cx="12" cy="16.6" r="1.4" fill="#bfe9ff"/>
        <path fill="#fff" opacity=".8" d="M11.2 15.7h.9v.9h-.9z"/>
      </svg>
    </button>
    <span class="trayDiv"></span>
    <div id="itemRail" aria-hidden="true">
      <div class="itemSlot" data-lv="4" title="Dawnedge">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#0e0a05" d="M12 .8 16.2 8.4 15.7 19H8.3L7.8 8.4Zm-6 19h12l-1.3 3.4H7.3Z"/>
          <path fill="#c6d5ea" d="M12 2.4 15.1 8.7l-.4 9.3H9.3l-.4-9.3Z"/>
          <path fill="#f4f9ff" d="M12 2.4 13.6 8.7l-.2 9.3h-1.4Z"/>
          <path fill="#6d82a4" d="M9.3 18h1.6l-.3-9.3-1.7-3.1Z"/>
          <path fill="#a5711c" d="M6.4 19.6h11.2l-1.1 2.8H7.5Z"/>
          <path fill="#ffd98c" d="M6.4 19.6h11.2l-.4 1.1H6.8Z"/>
        </svg>
      </div>
      <div class="itemSlot" data-lv="7" title="Aegis of the Sanctum">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#0e0a05" d="M12 1.1 21.6 4.6v7.9c0 5.3-4 9-9.6 10.5C6.4 21.5 2.4 17.8 2.4 12.5V4.6Z"/>
          <path fill="#2f5d9e" d="M12 2.7 20 5.6v6.9c0 4.4-3.3 7.6-8 9-4.7-1.4-8-4.6-8-9V5.6Z"/>
          <path fill="#4a86cf" d="M12 2.7 20 5.6v6.9c0 4.4-3.3 7.6-8 9Z"/>
          <path fill="#ffd98c" d="M12 2.7 20 5.6v1.9L12 4.7 4 7.5V5.6Z"/>
          <path fill="#e9f2ff" d="m12 7.4 2.1 3.7 4.1.6-3 2.9.7 4.1L12 16.8 8.1 18.7l.7-4.1-3-2.9 4.1-.6Z"/>
          <path fill="#9fbde2" d="m12 7.4-.1 9.4L8.1 18.7l.7-4.1-3-2.9 4.1-.6Z"/>
        </svg>
      </div>
      <div class="itemSlot" data-lv="10" title="Windstep Greaves">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#0e0a05" d="M4.4 19.6h15.2v3.2H4.4z"/>
          <path fill="#6a3a22" d="M5.2 10.4h6.2c1.4 3.2 4 4 7.2 5.2 1.3.5 1.6 1.6 1.6 4H4.4V12Z"/>
          <path fill="#8d5030" d="M5.2 10.4h6.2c.5 1.1 1.2 1.9 2 2.5l-8.2 2.6V12Z"/>
          <path fill="#c8934a" d="M4.4 19.6h15.8v1.4H4.4z"/>
          <path fill="#7fe6ff" d="M2 8.6 12 2.2l-1.6 4.6 4.2-1-8.2 6.6 1.4-4.2Z"/>
          <path fill="#e6fbff" d="M2 8.6 12 2.2l-1.6 4.6-3.4 1.2Z"/>
          <path fill="#0e0a05" opacity=".5" d="M4.4 16.9h15.6v.9H4.4z"/>
        </svg>
      </div>
      <div class="itemSlot" data-lv="13" title="Rift Heart">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#0e0a05" d="M12 .6 21.2 12 12 23.4 2.8 12Z"/>
          <path fill="#6a3ac0" d="M12 2.2 19.6 12 12 21.8 4.4 12Z"/>
          <path fill="#a575f2" d="M12 2.2 19.6 12 12 21.8Z"/>
          <path fill="#e3d0ff" d="M12 2.2 15.6 12 12 21.8 8.4 12Z"/>
          <path fill="#fff" opacity=".85" d="M12 2.2 13.9 9 12 12 10.1 9Z"/>
          <path fill="#ffd98c" d="M12 .6 13.1 3 12 2.2 10.9 3Z"/>
        </svg>
      </div>
    </div>
    <span class="trayDiv"></span>
    <button id="btnMenu" class="trayBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#0e0a05" d="m10 1.3h4l.5 2.7 2 1.1 2.5-1.1 2 3.4-2 1.9v2.3l2 1.9-2 3.4-2.5-1.1-2 1.1-.5 2.7h-4l-.5-2.7-2-1.1-2.5 1.1-2-3.4 2-1.9V9.3l-2-1.9 2-3.4L7.5 5.1l2-1.1z" transform="translate(0 1.2)"/>
        <path fill="#c9a24a" d="m10.6 3h2.8l.4 2.4 2.4 1.4 2.2-1 1.4 2.4-1.8 1.7v2.7l1.8 1.7-1.4 2.4-2.2-1-2.4 1.4-.4 2.4h-2.8l-.4-2.4-2.4-1.4-2.2 1L4.2 14l1.8-1.7V9.6L4.2 7.9l1.4-2.4 2.2 1 2.4-1.4z" transform="translate(0 1.2)"/>
        <path fill="#ffe7b4" d="m10.6 3h2.8l.4 2.4-1.8.8-1.8-.8z" transform="translate(0 1.2)"/>
        <circle cx="12" cy="13.2" r="4.4" fill="#12203a"/>
        <circle cx="12" cy="13.2" r="2.5" fill="#7fc4ff"/>
        <circle cx="11.2" cy="12.3" r="1" fill="#e9f7ff"/>
      </svg>
    </button>
  </div>

  <!-- forge / settings popovers (HUD-owned, closed by default) -->
  <div id="shopPanel" class="hudPanel" aria-hidden="true">
    <div class="hpHead"><b>RELIC FORGE</b><span class="hpGold"><i class="ico coin"></i><em id="shopGold">0</em></span></div>
    <ul class="hpList" id="shopList"></ul>
    <div class="hpFoot">Relics are forged automatically at the milestone level.</div>
  </div>

  <div id="menuPanel" class="hudPanel" aria-hidden="true">
    <div class="hpHead"><b>SETTINGS</b></div>
    <ul class="hpList">
      <li class="hpOpt" data-opt="dmg"><span>Combat text</span><i class="hpTog on"></i></li>
      <li class="hpOpt" data-opt="keys"><span>Keyboard hints</span><i class="hpTog"></i></li>
      <li class="hpOpt" data-opt="motion"><span>Reduced motion</span><i class="hpTog"></i></li>
    </ul>
    <div class="hpFoot">Tap the gear again to close.</div>
  </div>

  <!-- bottom-right: ability cluster (Wild Rift arc: A anchor + Q/W/E arc + R ultimate) -->
  <div id="abilityCluster">
    <span class="clusterScrim" aria-hidden="true"></span>
    <button id="btnR" class="abBtn ult" data-key="R" aria-label="Ultimate">
      <span class="abGlow"></span>
      <span class="abFrame"></span>
      <span class="abFace">
        <!-- R · DAWNFALL — the blade driven into the ground, sun cracking behind it -->
        <svg class="abArt" viewBox="0 0 48 48" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <radialGradient id="rBg" cx=".5" cy=".28" r=".95">
              <stop offset="0" stop-color="#ffdf9c"/><stop offset=".18" stop-color="#ff9a34"/>
              <stop offset=".5" stop-color="#c33f13"/><stop offset=".8" stop-color="#5e1409"/>
              <stop offset="1" stop-color="#240609"/>
            </radialGradient>
            <linearGradient id="rSteel" x1=".1" y1="0" x2=".9" y2="1">
              <stop offset="0" stop-color="#ffffff"/><stop offset=".38" stop-color="#d2e0f2"/>
              <stop offset=".72" stop-color="#8296b8"/><stop offset="1" stop-color="#41527a"/>
            </linearGradient>
            <linearGradient id="rGold" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff4d6"/><stop offset=".45" stop-color="#ffc95e"/>
              <stop offset="1" stop-color="#8e5c11"/>
            </linearGradient>
          </defs>
          <rect width="48" height="48" fill="url(#rBg)"/>
          <g fill="#ffeab4" opacity=".26">
            <path d="M24 17 2 5l20 13zM24 17 46 5 26 18zM24 17 0 22l24-3zM24 17l24 5-24-3zM24 17 12 44l14-26zM24 17l14 27-12-26z"/>
          </g>
          <circle cx="24" cy="16.5" r="11.5" fill="#ffeeb8" opacity=".4"/>
          <circle cx="24" cy="16.5" r="6.5" fill="#fffbe8" opacity=".55"/>
          <!-- ground + crater -->
          <path fill="#4e1a0b" d="M0 32c8-3.4 15-5 24-5s16 1.6 24 5v16H0z"/>
          <path fill="#a04a1c" d="M0 33.6c8-3.2 15-4.8 24-4.8s16 1.6 24 4.8V37H0z"/>
          <ellipse cx="24" cy="36.6" rx="18" ry="5.6" fill="none" stroke="#2a0d05" stroke-width="3"/>
          <ellipse cx="24" cy="35.6" rx="18" ry="5.6" fill="none" stroke="#ffd97e" stroke-width="1.7" opacity=".95"/>
          <ellipse cx="24" cy="34.6" rx="10.5" ry="3.2" fill="#1a0603"/>
          <ellipse cx="24" cy="33.8" rx="10.5" ry="3.2" fill="#ff8b2c"/>
          <ellipse cx="24" cy="34.2" rx="6.6" ry="1.9" fill="#2a0a04"/>
          <!-- dust plumes -->
          <g fill="#c58a5c" opacity=".38">
            <ellipse cx="9" cy="31" rx="7" ry="3.4"/><ellipse cx="39" cy="30.4" rx="6.4" ry="3"/>
          </g>
          <!-- rock shards -->
          <g fill="#2b1109"><path d="m6.4 26.6 3.4 1.4-2.2 2.6-2.6-1.8zM39.4 25.4l3.2 2-1.7 2.5-3-1.7zM13.4 22.4l2.3 1.4-1.5 1.9-2-1.1z"/></g>
          <g fill="#a06341"><path d="m6.8 27 2.6 1.2-1.8 2-2-1.4zM39.6 25.9l2.5 1.6-1.3 1.9-2.4-1.3z"/></g>
          <!-- blade, driven point-down -->
          <g stroke="#170905" stroke-width="1.15" stroke-linejoin="round">
            <path fill="url(#rGold)" d="M21.5 7.4h5v4.6h-5z"/>
            <path fill="url(#rGold)" d="M17.2 11.6h13.6l-1.9 3.4H19.1z"/>
            <path fill="url(#rSteel)" d="M19.3 15h9.4L24 35.4z"/>
            <path fill="#bfe9ff" d="m24 2.6 3 3.5-3 3.5-3-3.5z"/>
          </g>
          <path fill="#ffffff" opacity=".62" d="M24 15h3.4L24 32.6z"/>
          <path fill="#5c6f8f" d="M19.3 15h2.1L24 33.4z"/>
          <path fill="#ffffff" opacity=".85" d="m24 4 1.4 1.9L24 7.8l-1.4-1.9z"/>
          <path fill="#fff3d0" opacity=".7" d="M17.2 11.6h13.6l-.5.9H17.7z"/>
          <g fill="#ffdf9a"><circle cx="9.5" cy="19" r="1"/><circle cx="38.5" cy="15.5" r=".9"/><circle cx="33" cy="23" r=".7"/><circle cx="14.5" cy="13" r=".7"/></g>
        </svg>
        <svg class="abLock" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2A5.1 5.1 0 0 0 6.9 7.3v2.5H5.4v12.2h13.2V9.8h-1.5V7.3A5.1 5.1 0 0 0 12 2.2zm0 2.4a2.7 2.7 0 0 1 2.7 2.7v2.5H9.3V7.3A2.7 2.7 0 0 1 12 4.6zm0 9.1a1.9 1.9 0 0 1 .9 3.6v2h-1.8v-2a1.9 1.9 0 0 1 .9-3.6z"/></svg>
      </span>
      <span class="abSweep"></span>
      <span class="abCd"></span>
      <span class="abKey">R</span>
      <span class="abPips"></span>
      <span class="abPlus">+</span>
      <span class="abFlash"></span>
    </button>

    <button id="btnQ" class="abBtn" data-key="Q" aria-label="Ability Q">
      <span class="abFrame"></span>
      <span class="abFace">
        <!-- Q · CRESCENT SLASH — one heavy aqua sweep with two fading echoes -->
        <svg class="abArt" viewBox="0 0 48 48" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <radialGradient id="qBg" cx=".32" cy=".16" r=".96">
              <stop offset="0" stop-color="#54cadf"/><stop offset=".32" stop-color="#125b76"/>
              <stop offset=".72" stop-color="#06253a"/><stop offset="1" stop-color="#020d18"/>
            </radialGradient>
            <linearGradient id="qArc" x1=".06" y1="1" x2=".94" y2="0">
              <stop offset="0" stop-color="#1e9fc4"/><stop offset=".26" stop-color="#6ee6ff"/>
              <stop offset=".58" stop-color="#ffffff"/><stop offset="1" stop-color="#8ff0ff"/>
            </linearGradient>
            <linearGradient id="qSteel" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#b3c6e0"/>
              <stop offset="1" stop-color="#44557a"/>
            </linearGradient>
          </defs>
          <rect width="48" height="48" fill="url(#qBg)"/>
          <ellipse cx="14" cy="6" rx="23" ry="9" fill="#8ff0ff" opacity=".2"/>
          <path fill="#03151f" d="M0 32h48v16H0z"/>
          <path fill="#0d3c52" d="M0 32h48v2.6H0z"/>
          <g transform="rotate(-34 24 24)">
            <path fill="#5fd6f2" opacity=".3" d="M13 44.6Q24 29.6 35 44.6Q24 36.6 13 44.6Z"/>
            <path fill="#5fd6f2" opacity=".52" d="M7.5 39.6Q24 18.6 40.5 39.6Q24 28.6 7.5 39.6Z"/>
            <path fill="url(#qArc)" stroke="#02202e" stroke-width="1.7" stroke-linejoin="round"
                  d="M1.6 33.4Q24 -3 46.4 33.4Q24 16 1.6 33.4Z"/>
            <path fill="#c6f6ff" opacity=".92" d="M6 31.4Q24 2 42 31.4Q24 17.4 6 31.4Z"/>
            <path fill="#ffffff" d="M11 29.6Q24 7 37 29.6Q24 18.6 11 29.6Z"/>
          </g>
          <!-- steel edge riding the front of the sweep -->
          <g transform="rotate(56 38 15)">
            <g stroke="#03161f" stroke-width="1.1" stroke-linejoin="round">
              <path fill="url(#qSteel)" d="M38 4.6 40.7 10.2V21h-5.4V10.2z"/>
              <path fill="#d9a53f" d="M33.4 21h9.2l-.9 2.8h-7.4z"/>
            </g>
            <path fill="#ffffff" opacity=".62" d="M38 6.4 39.5 10.4V20H38z"/>
          </g>
          <g fill="#d9fbff"><path d="m42 26 1.2 2.4-1.2 2.4-1.2-2.4zM7 19l1 2-1 2-1-2zM35.5 35l.8 1.6-.8 1.6-.8-1.6z"/></g>
        </svg>

    <span class="sumScrim" aria-hidden="true"></span>

      <span class="sumFace">

        <svg class="sumArt" viewBox="0 0 48 48" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <radialGradient id="mBg" cx=".5" cy=".28" r=".9">

        </svg>
      </span>
      <span class="sumSweep"></span><span class="sumCd"></span>
    </button>

      <span class="sumFace">

          <defs>
            <radialGradient id="cBg" cx=".5" cy=".3" r=".9">
              <stop offset="0" stop-color="#7fb7ff"/><stop offset=".3" stop-color="#2a4b9e"/>

          <rect width="48" height="48" fill="url(#cBg)"/>

            <path stroke-width="1.6" d="M14 34c8-2 10-8 6-12s-4-9 4-11"/>

  <!-- floating joystick -->
  <div id="joyBase"><div class="joyRing"></div><div id="joyKnob"></div></div>
  <!-- resting joystick well (hidden while the floating stick is live) -->
  <div id="joyHome" aria-hidden="true"><span class="jhTicks"></span><span class="jhRing"></span><span class="jhNub"></span></div>

  <div id="announce"><div id="announceTitle"></div><div id="announceSub"></div></div>

  <div id="endScreen">
    <div id="endPanel" class="glass">
      <div id="endBanner">VICTORY</div>
      <div id="endStats"></div>
      <button id="endReplay">BATTLE AGAIN</button>

  </div>
</div>
